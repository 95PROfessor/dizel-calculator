<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход администратора</title><style>body{background:#101c28;color:#f4f7fb;font:16px system-ui;padding:40px;max-width:560px;margin:auto}a{color:#f2ae53}</style><h1>Вход администратора</h1><p id="status">Открываю защищённую страницу в Google…</p><a href="../">Вернуться в калькулятор</a><script>
fetch('../cloud-config.json',{cache:'no-store'}).then(r=>r.json()).then(c=>{const u=new URL(c.backendUrl);if(u.protocol!=='https:'||u.hostname!=='script.google.com'||!u.pathname.endsWith('/exec'))throw Error();u.searchParams.set('admin','1');location.replace(u.href);}).catch(()=>{document.getElementById('status').textContent='Подключение Google ещё не настроено. Укажите адрес веб-приложения в cloud-config.json.';});
</script></html>
