<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102232"><title>Проба · вес поезда</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#091722;color:#eef4f9;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding: max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));min-height:100svh}main{max-width:390px;margin:0 auto}header{margin:10px 0 28px}header p{font-size:11px;letter-spacing:.12em;color:#a9bdcd;margin:0 0 12px}h1{font-size:25px;margin:0;font-weight:650}header small{display:block;margin-top:8px;font-size:14px;color:#b6c9d8;line-height:1.5}.total{text-align:center;margin:0 0 22px;font-size:48px;font-weight:650;font-variant-numeric:tabular-nums;color:#f5b65c;letter-spacing:-.035em}.total span{font-size:20px;color:#dbe7ef;margin-left:6px;font-weight:400}.labels{display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:center;color:#b5c8d7;font-size:12px;margin-bottom:9px}.pickers{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:16px}.wheel-wrap{position:relative;min-width:0;background:#122b3e;border:1px solid #355168;border-radius:18px;overflow:hidden}.wheel-wrap:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#102232f0,transparent 38%,transparent 62%,#102232f0)}.wheel-wrap:before{content:"";position:absolute;left:8px;right:8px;top:88px;height:44px;border:1px solid #f3b15499;background:#efaa4012;border-radius:10px;pointer-events:none;z-index:1}.wheel{height:220px;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:88px 0;touch-action:pan-y}.wheel::-webkit-scrollbar{display:none}.item{height:44px;scroll-snap-align:center;scroll-snap-stop:normal;display:flex;align-items:center;justify-content:center;font-size:28px;font-variant-numeric:tabular-nums;color:#94acbe;user-select:none;-webkit-user-select:none;cursor:pointer}.item[aria-selected=true]{color:#fff;font-weight:650}.help{text-align:center;font-size:13px;color:#b6c9d8;margin:18px 0 24px}.confirm{width:100%;border:0;border-radius:13px;background:#efaa46;color:#201709;font:650 17px system-ui;padding:16px;cursor:pointer;touch-action:manipulation}.confirm:disabled{opacity:.4}.status{min-height:48px;text-align:center;font-size:14px;color:#c5e4ce;margin-top:16px;line-height:1.5}button:focus-visible,.wheel:focus-visible{outline:2px solid #f3b154;outline-offset:3px}.fine{display:flex;justify-content:center;gap:12px;margin:18px 0}.fine button{border:1px solid #355168;background:#122b3e;color:#eef4f9;border-radius:10px;width:48px;height:44px;font:24px system-ui;touch-action:manipulation}.fine span{align-self:center;font-size:13px;color:#b6c9d8}
</style></head><body><main><header><p>ПРОБА 3 · УСИЛЕННОЕ УСКОРЕНИЕ</p><h1>Вес брутто</h1><small>Две пары цифр вместо четырёх колёсиков</small></header><div class="total"><b id="total">3 560</b><span>т</span></div><div class="labels"><span>Первые две цифры</span><span>Последние две цифры</span></div><div class="pickers"><div class="wheel-wrap"><div id="first" class="wheel" role="listbox" aria-label="Первые две цифры веса" tabindex="0"></div></div><div class="wheel-wrap"><div id="last" class="wheel" role="listbox" aria-label="Последние две цифры веса" tabindex="0"></div></div></div><p class="help" id="speed-mode">Точно · по одному</p><button class="confirm" id="confirm" type="button">Готово · 3 560 т</button><div class="status" id="status" role="status" aria-live="polite"></div></main><script>
(()=>{'use strict';const first=document.getElementById('first'),last=document.getElementById('last'),total=document.getElementById('total'),confirm=document.getElementById('confirm'),status=document.getElementById('status');let a=35,b=60;const fmt=n=>n.toLocaleString('ru-RU');
function draw(){const weight=a*100+b;total.textContent=fmt(weight);confirm.textContent='Готово · '+fmt(weight)+' т';confirm.disabled=weight===0;for(const [el,n] of [[first,a],[last,b]])for(let i=0;i<el.children.length;i++)el.children[i].setAttribute('aria-selected',String(i===n));}
function setup(el,initial,set){
 const H=44,MAX=99*H,clamp=x=>Math.max(0,Math.min(MAX,x));
 let pointer=null,frame=0,lastFrame=0,suppressClick=false,wheelTimer=0,wheelTime=0;
 el.style.touchAction='none';el.style.scrollSnapType='none';
 const stop=()=>{cancelAnimationFrame(frame);frame=0;clearTimeout(wheelTimer);};
 function snap(){
  const from=el.scrollTop,to=clamp(Math.round(from/H)*H),start=performance.now();
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.scrollTop=to;return;}
  function tick(now){const p=Math.min(1,(now-start)/150);el.scrollTop=from+(to-from)*(1-Math.pow(1-p,3));if(p<1)frame=requestAnimationFrame(tick);else frame=0;}
  frame=requestAnimationFrame(tick);
 }
 function coast(velocity){
  lastFrame=performance.now();
  function tick(now){const dt=Math.min(32,now-lastFrame);lastFrame=now;velocity*=Math.exp(-dt/145);const before=el.scrollTop;el.scrollTop=clamp(before+velocity*dt);if(Math.abs(velocity)>.035&&Math.abs(el.scrollTop-before)>.01)frame=requestAnimationFrame(tick);else{frame=0;snap();}}
  frame=requestAnimationFrame(tick);
 }
 for(let i=0;i<100;i++){
  const item=document.createElement('div');item.className='item';item.textContent=String(i).padStart(2,'0');item.setAttribute('role','option');item.setAttribute('aria-selected',String(i===initial));
  item.onclick=()=>{if(suppressClick)return;stop();el.scrollTop=i*H;};el.append(item);
 }
 el.scrollTop=initial*H;
 el.addEventListener('scroll',()=>{set(Math.max(0,Math.min(99,Math.round(el.scrollTop/H))));status.textContent='';draw();},{passive:true});
 el.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;stop();suppressClick=false;
  pointer={id:e.pointerId,startY:e.clientY,y:e.clientY,time:performance.now(),speed:0,velocity:0,distance:0};el.setPointerCapture(e.pointerId);
 });
 el.addEventListener('pointermove',e=>{
  if(!pointer||e.pointerId!==pointer.id)return;e.preventDefault();const now=performance.now(),dt=Math.max(8,now-pointer.time),dy=pointer.y-e.clientY;
  pointer.distance+=Math.abs(dy);pointer.speed=pointer.speed*.2+Math.abs(dy)/dt*.8;
  const t=Math.max(0,Math.min(1,(pointer.speed-.12)/.85)),gain=1+11*t*t;
  const feedback=document.getElementById('speed-mode');if(feedback)feedback.textContent=gain<1.5?'Точно · по одному':'Ускорение ×'+Math.round(gain);
  const move=dy*gain;el.scrollTop=clamp(el.scrollTop+move);pointer.velocity=pointer.velocity*.25+Math.max(-8,Math.min(8,move/dt))*.75;
  pointer.y=e.clientY;pointer.time=now;if(pointer.distance>5)suppressClick=true;
 });
 el.addEventListener('pointerup',e=>{
  if(!pointer||e.pointerId!==pointer.id)return;const p=pointer;pointer=null;
  if(p.distance<=5){const item=document.elementFromPoint(e.clientX,e.clientY)?.closest('.item');if(item&&item.parentElement===el){stop();el.scrollTop=Number(item.textContent)*H;}return;}
  const fresh=performance.now()-p.time<90;if(fresh&&p.speed>.45)coast(p.velocity);else snap();
 });
 for(const type of ['pointercancel','lostpointercapture'])el.addEventListener(type,()=>{if(pointer){pointer=null;stop();snap();}});
 el.addEventListener('wheel',e=>{
  e.preventDefault();stop();const now=performance.now(),dt=Math.max(16,now-wheelTime),dy=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?220:1);wheelTime=now;
  const speed=Math.abs(dy)/dt,t=Math.max(0,Math.min(1,(speed-.3)/2));el.scrollTop=clamp(el.scrollTop+dy*(1+2.5*t*t));wheelTimer=setTimeout(snap,130);
 },{passive:false});
 el.addEventListener('keydown',e=>{const delta=e.key==='ArrowDown'?1:e.key==='ArrowUp'?-1:0;if(delta){e.preventDefault();stop();el.scrollTop=clamp((Math.round(el.scrollTop/H)+delta)*H);}});
}

setup(first,a,n=>a=n);setup(last,b,n=>b=n);draw();requestAnimationFrame(()=>{first.scrollTop=a*44;last.scrollTop=b*44;});confirm.onclick=()=>{status.textContent='Выбрано '+fmt(a*100+b)+' т. Это только проба — в историю ничего не записывается.';};})();
</script></body></html>
